name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WiseWMS.Api/WiseWMS.Api.slnx

      - name: Build
        run: dotnet build WiseWMS.Api/WiseWMS.Api.slnx --no-restore -c Release

      - name: Test
        run: dotnet test WiseWMS.Api/WiseWMS.Api.slnx --no-build -c Release --verbosity normal

      - name: Docker build API
        run: docker build -t wisewms-api ./WiseWMS.Api
