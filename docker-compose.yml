services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WiseWMS_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "WiseWMS_Pass123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./WiseWMS.Api
      dockerfile: Dockerfile
    ports:
      - "7176:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=WiseWMS;User Id=sa;Password=WiseWMS_Pass123;TrustServerCertificate=True;"
      Jwt__Key: "WiseWMS_SuperSecretKey_2026_MustBeAtLeast32Chars!"
      Jwt__Issuer: "WiseWMS"
      Jwt__Audience: "WiseWMS"
      Jwt__ExpireMinutes: "120"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./wise-wms-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:7176"
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
